[project]
name = "weather-bot"
version = "0.1.0"
description = "LINE 天氣與角色聊天機器人"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "httpx>=0.27.0,<1",
    "aiosqlite>=0.20.0,<1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
junit_family = "xunit1"
testpaths = ["tests"]
markers = ["live: 真實 CWA 與 BIRC 模型驗證，LINE 不發送"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_bot"]
